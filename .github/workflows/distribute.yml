name: Distribute to Testers

# 네이티브 코드(android/, ios/ 실제 빌드 산출물)가 변경되면
# Shorebird OTA 로 처리할 수 없으므로 자동으로 Firebase App Distribution 에
# 새 빌드를 올려 테스터가 재설치하도록 한다.
#
# fastlane/metadata/screenshots, README 등 빌드와 무관한 파일은 트리거에서 제외.
# 수동 실행(workflow_dispatch)도 그대로 지원한다.

on:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/build.gradle*'
      - 'android/settings.gradle*'
      - 'android/gradle/**'
      - 'android/gradle.properties'
      - 'ios/Runner/**'
      - 'ios/Runner.xcodeproj/**'
      - 'ios/Runner.xcworkspace/**'
      - 'ios/Podfile'
      - 'ios/Podfile.lock'
      - 'ios/Flutter/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to distribute'
        required: true
        default: 'both'
        type: choice
        options:
          - android
          - ios
          - both
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'New test build'

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute-android:
    name: Distribute Android
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'both' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.6'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create .env file
        run: |
          echo "ENVIRONMENT=production" > .env

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/mathlab-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=mathlab-release.jks
          EOF

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Install Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Get dependencies
        run: flutter pub get

      - name: Generate native splash drawables
        run: dart run flutter_native_splash:create

      # shorebird release 가 내부적으로 flutter build apk --release 를 돌린 뒤
      # 동일 산출물을 Shorebird 콘솔에 등록한다. 이렇게 해야 distribute 와
      # 후속 OTA patch 가 같은 native dex 기반으로 동작한다.
      # release-version 은 pubspec.yaml 의 version 을 그대로 사용한다
      # (shorebird CLI 의 --release-version 플래그는 aar/ios-framework 전용).
      - name: Shorebird release android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android --artifact apk --no-confirm

      - name: Compose release notes
        id: notes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG=$(git log -1 --pretty=%s)
            echo "value=Auto: $MSG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_notes }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ steps.notes.outputs.value }}

  distribute-ios:
    name: Distribute iOS
    runs-on: macos-latest
    if: ${{ github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'both' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.6'
          cache: true

      - name: Create .env file
        run: |
          echo "ENVIRONMENT=production" > .env

      - name: Decode GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Install Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      # shorebird release 가 내부적으로 flutter build ipa 를 돌린 뒤
      # 동일 산출물을 Shorebird 콘솔에 등록한다.
      # release-version 은 pubspec version 으로 자동 결정 (플래그 없음).
      # --export-options-plist 로 ad-hoc method + provisioning profile 매핑을
      # 명시 (Xcode 15+ 의 ad-hoc → release-testing 자동 변환과 capability
      # 누락 오류 회피).
      - name: Shorebird release ios
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release ios --no-confirm -- \
            --export-options-plist=ios/exportOptions-adhoc.plist

      - name: Locate IPA
        id: ipa
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA file not found under build/ios/ipa/"
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        id: notes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG=$(git log -1 --pretty=%s)
            echo "value=Auto: $MSG" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_notes }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_IOS_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: ${{ steps.ipa.outputs.path }}
          releaseNotes: ${{ steps.notes.outputs.value }}
