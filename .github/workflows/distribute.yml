name: Distribute to Testers

# Firebase App Distribution Android 배포 워크플로우.
# 자동 트리거 없음 — GitHub Actions UI 또는
# `gh workflow run "Distribute to Testers"` 으로 수동 실행만 가능.
#
# iOS 는 macOS runner 분당 10배 가중치 + CocoaPods/Xcode 빌드가 느려
# Actions 분 청구가 폭증한다. iOS 는 로컬에서
# `./scripts/deploy.sh test ios` 또는 `./scripts/deploy.sh store ios` 로
# 처리한다. CI 에서 iOS 가 다시 필요해지면 .archive/distribute_ios.yml
# 같은 별도 파일로 분리해 명시적으로만 실행할 것.

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for testers'
        required: false
        default: 'New test build'

concurrency:
  group: distribute-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute-android:
    name: Distribute Android
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Gradle 캐시 — 매 실행마다 의존성 다운로드 + 빌드 산출물 재생성을 피함.
      # cache-read-only: false 라 빌드 결과를 같은 ref 후속 실행에 재사용.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # pub cache — flutter-action 의 cache:true 는 SDK 만 캐시.
      # ~/.pub-cache 는 별도로 캐시해야 pub get 시간이 줄어듦.
      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create .env file
        run: |
          echo "ENVIRONMENT=production" > .env

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/mathlab-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=mathlab-release.jks
          EOF

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Install Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Get dependencies
        run: flutter pub get

      - name: Generate native splash drawables
        run: dart run flutter_native_splash:create

      # shorebird release 가 내부적으로 flutter build apk --release 를 돌린 뒤
      # 동일 산출물을 Shorebird 콘솔에 등록한다.
      - name: Shorebird release android
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android --artifact apk --no-confirm \
            --flutter-version=3.41.9

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ inputs.release_notes }}
