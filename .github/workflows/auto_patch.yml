name: Auto OTA Patch (Shorebird)

# OTA patch 발행 워크플로우. 자동 트리거 비활성 — GitHub Actions UI 또는
# `gh workflow run "Auto OTA Patch (Shorebird)"` 으로 수동 실행만 가능.
#
# 일반적으로는 로컬에서 ./scripts/deploy.sh patch [android|ios|both] 로 진행.
# 백업/원격 빌드 환경이 필요할 때만 이 워크플로우를 수동 트리거한다.

on:
  workflow_dispatch:

concurrency:
  group: shorebird-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-android:
    name: Shorebird Patch (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Shorebird release를 만들 때 사용한 Flutter 버전과 동일해야 함.
      # 다르면 native dex가 달라져 'UnpatchableChangeException' 발생.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create dummy .env (asset_does_not_exist 방지)
        run: touch .env

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode > android/app/mathlab-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=mathlab-release.jks
          EOF

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | base64 --decode > android/app/google-services.json

      - name: Install Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Get dependencies
        run: flutter pub get

      - name: Generate native splash drawables
        run: dart run flutter_native_splash:create

      - name: Shorebird patch android (stable track)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch android \
            --release-version=$(grep '^version:' pubspec.yaml | sed 's/version: //') \
            --no-confirm \
            --allow-asset-diffs

  patch-ios:
    name: Shorebird Patch (iOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Create dummy .env (asset_does_not_exist 방지)
        run: touch .env

      - name: Decode GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" \
            | base64 --decode > ios/Runner/GoogleService-Info.plist

      # Shorebird patch ios 도 내부적으로 flutter build ipa --release 를 호출하므로
      # 코드 서명 인증서와 프로비저닝 프로필을 임시 키체인에 임포트해야 한다.
      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Install Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Shorebird patch ios (stable track)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch ios \
            --release-version=$(grep '^version:' pubspec.yaml | sed 's/version: //') \
            --no-confirm \
            --allow-asset-diffs \
            --export-options-plist=ios/exportOptions-adhoc.plist
