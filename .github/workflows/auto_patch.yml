name: Auto OTA Patch (Shorebird) — Android only

# Shorebird OTA 패치 워크플로우 (Android 전용).
# 자동 트리거 없음 — GitHub Actions UI 또는
# `gh workflow run "Auto OTA Patch (Shorebird)"` 으로 수동 실행만 가능.
#
# iOS 는 macOS runner 분당 10배 가중치로 GitHub Free 한도를 빠르게 소진해
# 의도적으로 제거. 로컬에서 `./scripts/deploy.sh patch ios` 로 진행한다.

on:
  workflow_dispatch:

concurrency:
  group: shorebird-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-android:
    name: Shorebird Patch (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Production environment gates secret access behind owner approval.
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Shorebird release를 만들 때 사용한 Flutter 버전과 동일해야 함.
      # 다르면 native dex가 달라져 'UnpatchableChangeException' 발생.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.41.9'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Cache Flutter pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Create dummy .env (asset_does_not_exist 방지)
        run: touch .env

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode > android/app/mathlab-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=mathlab-release.jks
          EOF

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | base64 --decode > android/app/google-services.json

      - name: Install Shorebird CLI
        uses: shorebirdtech/setup-shorebird@v1

      - name: Get dependencies
        run: flutter pub get

      - name: Generate native splash drawables
        run: dart run flutter_native_splash:create

      - name: Shorebird patch android (stable track)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird patch android \
            --release-version=$(grep '^version:' pubspec.yaml | sed 's/version: //') \
            --no-confirm \
            --allow-asset-diffs
